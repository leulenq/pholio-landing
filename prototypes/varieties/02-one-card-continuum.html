<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pholio / One Card Continuum</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300&family=Italiana&display=swap');
    *{box-sizing:border-box}html,body{margin:0;background:#0a0a09;color:#eee9de}body{height:780vh;overflow-x:hidden}.stage{position:fixed;inset:0;overflow:hidden;background:#0a0a09;perspective:1800px}.nav{position:absolute;z-index:50;top:0;left:0;width:100%;padding:24px 28px;display:flex;justify-content:space-between;color:#f0eadf}.mark{font:20px Arial;letter-spacing:.32em;position:relative}.mark:after{content:"";position:absolute;left:0;right:.32em;bottom:-7px;height:1px;background:#b89757}.nav a{color:inherit;text-decoration:none;font:10px DM Mono;letter-spacing:.14em;text-transform:uppercase}.word{position:absolute;z-index:1;left:50%;top:50%;transform:translate(-50%,-50%);font:clamp(90px,19vw,300px)/.7 Arial;letter-spacing:-.09em;color:#e9e4d9}.model{position:absolute;z-index:2;left:50%;bottom:-2vh;transform:translateX(-50%);height:92vh;filter:grayscale(1)}.orbit{position:absolute;inset:0;z-index:8;transform-style:preserve-3d}.card{position:absolute;left:50%;top:50%;width:min(42vw,630px);aspect-ratio:1.54;transform:translate(-50%,-50%) translateZ(200px);transform-style:preserve-3d}.face{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden;box-shadow:0 40px 100px rgba(0,0,0,.5)}.back{transform:rotateY(180deg)}.ghost{position:absolute;left:50%;top:50%;width:min(31vw,480px);transform:translate(-50%,-50%);opacity:0;box-shadow:0 30px 80px rgba(0,0,0,.4)}.name{position:absolute;z-index:4;font:clamp(50px,8vw,130px)/.82 Italiana;color:#eee9de;letter-spacing:-.04em;opacity:0;white-space:nowrap}.name.one{left:5vw;top:18vh}.name.two{right:5vw;bottom:12vh}.meta{position:absolute;z-index:12;font:10px DM Mono;letter-spacing:.16em;color:#b89757;opacity:0}.meta.a{left:5vw;bottom:6vh}.meta.b{right:5vw;top:12vh}.cream{position:absolute;inset:0;background:#e9e3d6;opacity:0}.close{position:absolute;z-index:30;inset:0;display:grid;place-items:center;opacity:0}.close span{font:clamp(85px,18vw,280px)/.75 Arial;letter-spacing:-.09em;color:#151411}.close span:after{content:"";display:block;width:55%;height:2px;background:#b28e4c;margin:5vh auto 0}.grain{position:absolute;z-index:45;inset:-30%;opacity:.045;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 150 150' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    @media(max-width:700px){body{height:680vh}.nav{padding:18px}.word{font-size:25vw}.model{height:75vh;max-width:115vw;object-fit:contain}.card{width:84vw}.ghost{width:62vw}.name{font-size:16vw}.name.one{left:5vw;top:17vh}.name.two{right:5vw;bottom:14vh}.meta.a{left:18px}.meta.b{right:18px}}
  </style>
</head>
<body><main class="stage">
  <div class="cream"></div><div class="word">PHOLIO</div><img class="model" src="../../public/images/model2-nobg.png" alt="Model portrait">
  <nav class="nav"><div class="mark">PHOLIO</div><a href="index.html">Varieties</a></nav>
  <div class="name one">Elara Keats</div><div class="name two">New York</div><div class="meta a">FRONT / BACK</div><div class="meta b">01 / 03</div>
  <div class="orbit"><img class="ghost g1" src="../../public/generated/comp-card/elara-keats-gallery-mat.png" alt="Card edition"><img class="ghost g2" src="../../public/generated/comp-card/elara-keats-split-field.png" alt="Card edition"><img class="ghost g3" src="../../public/generated/comp-card/elara-keats-statement.png" alt="Card edition"><div class="card"><img class="face front" src="../../public/generated/comp-card/elara-keats-front.png" alt="Comp card front"><img class="face back" src="../../public/generated/comp-card/elara-keats-back.png" alt="Comp card back"></div></div>
  <div class="close"><span>PHOLIO</span></div><div class="grain"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const tl=gsap.timeline({scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:1.35}});
    tl.to('.model',{scale:1.3,y:'14vh',opacity:.12,duration:1.1,ease:'power2.inOut'},0).to('.word',{scale:1.25,opacity:.08,duration:1.1},0)
      .from('.card',{scale:.08,rotationY:-18,opacity:0,duration:1.25,ease:'power4.out'},.55)
      .to('.card',{x:'-25vw',y:'-12vh',rotationY:8,rotationX:-4,scale:.78,duration:1.2,ease:'power3.inOut'},1.6)
      .to('.name.one,.name.two,.meta.a,.meta.b',{opacity:1,duration:.45},2.05)
      .to('.card',{x:'18vw',y:'8vh',rotationY:180,rotationX:3,scale:1.08,duration:1.55,ease:'power3.inOut'},2.75)
      .to('.name.one',{x:'-10vw',opacity:.12,duration:1.1},2.75).to('.name.two',{x:'10vw',opacity:.12,duration:1.1},2.75)
      .to('.card',{x:0,y:0,rotationY:360,rotationX:0,scale:.76,duration:1.35,ease:'power3.inOut'},4.2)
      .to('.meta.a,.meta.b',{opacity:0,duration:.35},4.2)
      .to('.g1',{x:'-31vw',y:'-24vh',rotation:-8,opacity:.7,duration:1.0,ease:'power3.out'},4.6)
      .to('.g2',{x:'32vw',y:'-19vh',rotation:7,opacity:.7,duration:1.0,ease:'power3.out'},4.7)
      .to('.g3',{x:'28vw',y:'27vh',rotation:-4,opacity:.7,duration:1.0,ease:'power3.out'},4.8)
      .to('.cream',{opacity:1,duration:1.0,ease:'power2.inOut'},5.35).to('.nav',{color:'#151411',duration:.8},5.35)
      .to('.orbit',{rotationZ:2,scale:.93,duration:1.1},5.35)
      .to('.ghost',{x:0,y:0,rotation:0,scale:.2,opacity:0,duration:1.0,ease:'power3.in'},6.3)
      .to('.card',{scale:.18,rotationY:540,opacity:0,duration:1.05,ease:'power3.in'},6.3)
      .to('.close',{opacity:1,duration:.8},6.9);
    }
  </script>
</body></html>
