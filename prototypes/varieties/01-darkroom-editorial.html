<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pholio / Darkroom Editorial</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Italiana&display=swap');
    *{box-sizing:border-box}html,body{margin:0;background:#080807;color:#f1ede3;font-family:Arial,sans-serif}body{height:700vh;overflow-x:hidden}.film{position:fixed;inset:0;overflow:hidden;background:#080807}.grain{position:absolute;inset:-40%;opacity:.09;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");animation:grain .18s steps(2) infinite}.nav{position:absolute;z-index:30;top:0;left:0;width:100%;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;color:inherit}.mark{font:400 20px/1 Arial;letter-spacing:.32em;position:relative}.mark:after{content:"";position:absolute;left:0;right:.32em;bottom:-7px;height:1px;background:#ba9551;transform:rotate(-1.5deg)}.nav a{color:inherit;text-decoration:none;font:10px DM Mono;letter-spacing:.14em;text-transform:uppercase}.hero-word{position:absolute;z-index:1;left:50%;top:48%;transform:translate(-50%,-50%);font:clamp(86px,18vw,290px)/.72 Arial,sans-serif;letter-spacing:-.085em;color:#eee9dc;white-space:nowrap}.hero-model{position:absolute;z-index:3;height:min(92vh,900px);left:50%;bottom:-3vh;transform:translateX(-50%);filter:grayscale(1) contrast(1.08)}.verb{position:absolute;z-index:6;left:50%;bottom:8vh;transform:translateX(-50%);font:18px Italiana,serif;letter-spacing:.04em}.scan-stage{position:absolute;z-index:8;inset:0;opacity:0}.scan-photo{position:absolute;left:50%;top:52%;height:76vh;max-width:66vw;transform:translate(-50%,-50%);object-fit:cover;filter:grayscale(1) contrast(1.12)}.scan-line{position:absolute;left:17%;right:17%;top:20%;height:1px;background:#c39a51;box-shadow:0 0 22px 2px #ad6b29}.scan-line:before{content:"";position:absolute;left:0;right:0;top:-50px;height:50px;background:linear-gradient(transparent,rgba(189,128,58,.08))}.ticks{position:absolute;inset:9vh 6vw;font:10px DM Mono;letter-spacing:.12em;color:#b99b67}.ticks span{position:absolute}.ticks span:nth-child(1){left:0;top:22%}.ticks span:nth-child(2){right:0;top:46%}.ticks span:nth-child(3){left:0;bottom:18%}.paper{position:absolute;z-index:11;inset:0;background:#e9e3d7;color:#141310;clip-path:inset(100% 0 0)}.paper-title{position:absolute;left:6vw;top:10vh;font:clamp(54px,9vw,150px)/.8 Italiana,serif;letter-spacing:-.045em}.assembly{position:absolute;inset:0;perspective:1500px}.source{position:absolute;width:19vw;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1);box-shadow:0 18px 55px rgba(30,22,12,.12)}.s1{left:7vw;top:37vh;transform:rotate(-5deg)}.s2{right:7vw;top:16vh;transform:rotate(4deg)}.s3{right:17vw;bottom:-8vh;transform:rotate(-2deg)}.card{position:absolute;z-index:4;left:50%;top:55%;width:min(37vw,520px);aspect-ratio:1.54;transform:translate(-50%,-50%) rotateY(-9deg) rotateX(3deg);transform-style:preserve-3d;box-shadow:0 35px 85px rgba(29,20,9,.23)}.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden}.card .back{transform:rotateY(180deg)}.edition{position:absolute;z-index:12;inset:0;background:#e9e3d7;opacity:0;color:#141310;overflow:hidden}.rail{position:absolute;left:0;top:50%;display:flex;gap:2vw;align-items:center;transform:translateY(-50%);padding:0 8vw;width:max-content}.rail img{width:32vw;max-width:500px;box-shadow:0 22px 50px rgba(30,20,10,.12)}.rail img:nth-child(2){width:42vw}.rail-label{position:absolute;left:6vw;bottom:5vh;font:10px DM Mono;letter-spacing:.14em}.end{position:absolute;z-index:20;inset:0;background:#080807;opacity:0;display:grid;place-items:center}.end-word{font:clamp(86px,18vw,290px)/.72 Arial;letter-spacing:-.085em}.end-word:after{content:"";display:block;width:58%;height:2px;background:#ba9551;margin:5vh auto 0;transform:rotate(-1deg)}
    @keyframes grain{0%{transform:translate(0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}}
    @media(max-width:700px){body{height:620vh}.nav{padding:18px}.hero-word{font-size:25vw}.hero-model{height:75vh;max-width:110vw;object-fit:contain}.scan-photo{max-width:84vw;height:66vh}.ticks{inset:9vh 4vw}.source{width:31vw}.s1{left:2vw}.s2{right:2vw}.s3{right:5vw}.card{width:78vw}.paper-title{top:12vh}.rail img{width:74vw}.rail img:nth-child(2){width:82vw}.rail{gap:6vw}.rail-label{left:18px}}
    @media(prefers-reduced-motion:reduce){.grain{animation:none}}
  </style>
</head>
<body>
  <main class="film">
    <div class="grain"></div>
    <nav class="nav"><div class="mark">PHOLIO</div><a href="index.html">Varieties</a></nav>
    <div class="hero-word">PHOLIO</div>
    <img class="hero-model" src="../../public/images/model2-nobg.png" alt="Model portrait">
    <div class="verb">Present</div>
    <section class="scan-stage">
      <img class="scan-photo" src="../../public/generated/comp-card/source/mara-voss-red-hero.jpg" alt="Editorial portrait">
      <div class="scan-line"></div>
      <div class="ticks"><span>PORTRAIT</span><span>EDITORIAL</span><span>BOOK</span></div>
    </section>
    <section class="paper">
      <div class="paper-title">Comp card</div>
      <div class="assembly">
        <img class="source s1" src="../../public/generated/comp-card/source/mara-voss-crossed-arm.jpg" alt="Portfolio image">
        <img class="source s2" src="../../public/generated/comp-card/source/mara-voss-profile.jpg" alt="Portfolio image">
        <img class="source s3" src="../../public/generated/comp-card/source/mara-voss-red-hero.jpg" alt="Portfolio image">
        <div class="card"><img class="front" src="../../public/generated/comp-card/elara-keats-front.png" alt="Comp card front"><img class="back" src="../../public/generated/comp-card/elara-keats-back.png" alt="Comp card back"></div>
      </div>
    </section>
    <section class="edition"><div class="rail"><img src="../../public/generated/comp-card/elara-keats-gallery-mat.png" alt="Comp card edition"><img src="../../public/generated/comp-card/elara-keats-split-field.png" alt="Comp card edition"><img src="../../public/generated/comp-card/elara-keats-statement.png" alt="Comp card edition"></div><div class="rail-label">EDITIONS / 01 02 03</div></section>
    <section class="end"><div class="end-word">PHOLIO</div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reduce){
      const tl=gsap.timeline({scrollTrigger:{trigger:document.body,start:'top top',end:'bottom bottom',scrub:1.2}});
      tl.to('.hero-word',{scale:1.16,opacity:.12,duration:1.1,ease:'power2.inOut'},0)
        .to('.hero-model',{scale:1.22,y:'12vh',filter:'grayscale(1) contrast(1.3) brightness(.45)',duration:1.1,ease:'power2.inOut'},0)
        .to('.verb',{opacity:0,y:-20,duration:.4},.15)
        .to('.scan-stage',{opacity:1,duration:.65},.5)
        .fromTo('.scan-photo',{scale:.82,clipPath:'inset(48% 0 48%)'},{scale:1,clipPath:'inset(0% 0 0%)',duration:1.4,ease:'power3.inOut'},.55)
        .to('.scan-line',{top:'80%',duration:1.45,ease:'power1.inOut'},.55)
        .to('.ticks',{opacity:1,duration:.3},.85)
        .to('.scan-photo',{scale:1.32,filter:'grayscale(1) contrast(1.2) brightness(.5)',duration:1.1,ease:'power2.in'},1.8)
        .to('.paper',{clipPath:'inset(0% 0 0)',duration:1.15,ease:'power3.inOut'},1.95)
        .to('.nav',{color:'#141310',duration:.7},2.05)
        .from('.paper-title',{x:'-15vw',opacity:0,duration:.8},2.2)
        .from('.source',{scale:.62,opacity:0,stagger:.08,duration:.8,ease:'power3.out'},2.25)
        .from('.card',{scale:.18,rotationY:-36,opacity:0,duration:1.15,ease:'power4.out'},2.38)
        .to('.source',{x:i=>i===0?'14vw':i===1?'-17vw':'-10vw',y:i=>i===0?'-8vh':i===1?'14vh':'-17vh',scale:.62,opacity:.24,duration:1.1,ease:'power3.inOut'},3.3)
        .to('.card',{rotationY:180,scale:1.12,duration:1.35,ease:'power3.inOut'},3.3)
        .to('.edition',{opacity:1,duration:.55},4.25)
        .to('.rail',{x:()=>Math.min(0,innerWidth-document.querySelector('.rail').scrollWidth),duration:2.1,ease:'none'},4.3)
        .to('.edition',{scale:.93,filter:'brightness(.3)',duration:.75,ease:'power2.in'},6.2)
        .to('.end',{opacity:1,duration:.8},6.45)
        .to('.nav',{color:'#f1ede3',duration:.55},6.55);
    }
  </script>
</body>
</html>
